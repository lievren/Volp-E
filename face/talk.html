<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no">

<meta name="theme-color" content="#05070d">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Volp-E // Talk</title>

<style>
:root{
  --bg:#05070d;
  --panel:rgba(9,17,31,.9);
  --cyan:#31f5ff;
  --pink:#ff3bd4;
  --green:#4dff9b;
  --orange:#ffb347;
  --red:#ff5f77;
  --text:#ecfaff;
  --muted:#7892a8;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  color:var(--text);
  font-family:Arial,sans-serif;
  background:
    radial-gradient(circle at 10% 0%,
      rgba(255,59,212,.15),transparent 30%),
    radial-gradient(circle at 100% 20%,
      rgba(49,245,255,.13),transparent 30%),
    #05070d;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(
      rgba(49,245,255,.035) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(49,245,255,.035) 1px,
      transparent 1px
    );
  background-size:27px 27px;
}

.app{
  width:min(94vw,620px);
  height:100dvh;
  margin:auto;
  padding:10px 0;
  display:grid;
  grid-template-rows:auto 1fr auto auto;
  gap:8px;
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.back{
  padding:8px 11px;
  color:var(--cyan);
  text-decoration:none;
  border-radius:11px;
  border:1px solid rgba(49,245,255,.25);
  background:rgba(49,245,255,.05);
  font-size:12px;
}

.heading{
  text-align:right;
}

.heading strong{
  display:block;
  color:var(--pink);
  font-size:13px;
  letter-spacing:2px;
}

.heading small{
  color:var(--muted);
  font:9px Consolas,monospace;
}

.main{
  position:relative;
  min-height:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  border:1px solid rgba(255,59,212,.20);
  border-radius:18px;
  background:var(--panel);
  overflow:hidden;
}

.main:before{
  content:"VOICE INPUT CHANNEL";
  position:absolute;
  top:12px;
  left:14px;
  color:var(--cyan);
  font:9px Consolas,monospace;
  letter-spacing:1.5px;
}

.wave{
  height:65px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  margin-bottom:18px;
}

.bar{
  width:4px;
  height:10px;
  border-radius:5px;
  background:var(--cyan);
  box-shadow:0 0 8px var(--cyan);
}

.listening .bar{
  animation:wave .45s ease-in-out infinite alternate;
}

.bar:nth-child(2){animation-delay:.06s}
.bar:nth-child(3){animation-delay:.12s}
.bar:nth-child(4){animation-delay:.18s}
.bar:nth-child(5){animation-delay:.24s}
.bar:nth-child(6){animation-delay:.16s}
.bar:nth-child(7){animation-delay:.08s}
.bar:nth-child(8){animation-delay:.20s}
.bar:nth-child(9){animation-delay:.10s}

@keyframes wave{
  from{height:8px}
  to{height:52px}
}

.talk-button{
  position:relative;
  width:min(47vw,190px);
  aspect-ratio:1;
  border-radius:50%;
  border:2px solid var(--pink);
  background:
    radial-gradient(
      circle,
      rgba(255,59,212,.22),
      rgba(255,59,212,.05) 55%,
      rgba(0,0,0,.15)
    );
  color:var(--pink);
  box-shadow:
    0 0 25px rgba(255,59,212,.18),
    inset 0 0 25px rgba(255,59,212,.10);
  touch-action:none;
  user-select:none;
  cursor:pointer;
}

.talk-button:before{
  content:"";
  position:absolute;
  inset:10px;
  border-radius:50%;
  border:1px solid rgba(49,245,255,.23);
}

.mic{
  display:block;
  font-size:37px;
  margin-bottom:7px;
}

.hold{
  display:block;
  font:bold 11px Consolas,monospace;
  letter-spacing:1.5px;
}

.talk-button.active{
  color:var(--green);
  border-color:var(--green);
  box-shadow:
    0 0 35px rgba(77,255,155,.32),
    inset 0 0 30px rgba(77,255,155,.13);
  transform:scale(.97);
}

.status{
  margin-top:20px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 12px;
  border-radius:999px;
  border:1px solid rgba(49,245,255,.16);
  color:var(--cyan);
  background:rgba(49,245,255,.04);
  font:bold 10px Consolas,monospace;
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:currentColor;
  box-shadow:0 0 8px currentColor;
}

.status.listen{
  color:var(--green);
  border-color:rgba(77,255,155,.25);
}

.status.error{
  color:var(--red);
  border-color:rgba(255,95,119,.25);
}

.telemetry{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:6px;
}

.box{
  min-width:0;
  padding:9px 6px;
  border:1px solid rgba(49,245,255,.13);
  border-radius:11px;
  background:rgba(9,17,31,.9);
  text-align:center;
}

.box .name{
  color:var(--muted);
  font:8px Consolas,monospace;
  letter-spacing:.8px;
}

.box .value{
  margin-top:4px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  color:var(--cyan);
  font:bold 10px Consolas,monospace;
}

.text-chat{
  display:grid;
  grid-template-columns:1fr auto;
  gap:6px;
}

.text-chat input{
  min-width:0;
  height:38px;
  padding:0 11px;
  border-radius:10px;
  border:1px solid rgba(49,245,255,.22);
  outline:none;
  background:rgba(9,17,31,.96);
  color:var(--text);
  font:11px Consolas,monospace;
}

.text-chat input:focus{
  border-color:var(--cyan);
  box-shadow:0 0 10px rgba(49,245,255,.12);
}

.text-chat input::placeholder{
  color:var(--muted);
}

.text-chat button{
  min-width:70px;
  padding:0 12px;
  border-radius:10px;
  border:1px solid rgba(255,59,212,.45);
  background:rgba(255,59,212,.08);
  color:var(--pink);
  font:bold 10px Consolas,monospace;
  letter-spacing:1px;
  cursor:pointer;
}

.text-chat button:disabled,
.text-chat input:disabled{
  opacity:.45;
}

.conversation-panel{
  min-height:115px;
  max-height:155px;
  overflow-y:auto;
  border:1px solid rgba(49,245,255,.18);
  border-radius:11px;
  background:rgba(9,17,31,.9);
  padding:8px 10px;
  scrollbar-width:thin;
}

.conversation-title{
  position:sticky;
  top:0;
  z-index:2;
  padding-bottom:5px;
  margin-bottom:5px;
  color:var(--pink);
  background:rgba(9,17,31,.98);
  font:8px Consolas,monospace;
  letter-spacing:1.2px;
}

.exchange{
  padding:6px 0;
  border-top:1px solid rgba(49,245,255,.08);
}

.exchange:first-of-type{
  border-top:0;
}

.message-label{
  margin-bottom:2px;
  font:bold 7px Consolas,monospace;
  letter-spacing:1px;
}

.message-label.user{
  color:var(--cyan);
}

.message-label.volpe{
  color:var(--pink);
  margin-top:5px;
}

.message-text{
  color:var(--text);
  font:10px Consolas,monospace;
  line-height:1.35;
  white-space:normal;
  overflow-wrap:anywhere;
}

.message-text.volpe{
  color:var(--green);
}

.history-empty{
  padding:17px 0;
  text-align:center;
  color:var(--muted);
  font:9px Consolas,monospace;
}

@media(max-height:700px){
  .app{
    padding:6px 0;
    gap:5px;
  }

  .talk-button{
    width:min(38vw,145px);
  }

  .wave{
    height:42px;
    margin-bottom:8px;
  }

  .status{
    margin-top:10px;
  }

  .box{
    padding:6px 4px;
  }
}
</style>
</head>

<body>

<div class="app">

  <header class="top">
    <a class="back" href="/">‹ CORE</a>

    <div class="heading">
      <strong>TALK CONTROL</strong>
      <small>VOLP-E // AUDIO-LINK</small>
    </div>
  </header>

  <main class="main" id="mainPanel">

    <div class="wave" id="wave">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </div>

    <button
      class="talk-button"
      id="talkButton"
      type="button"
    >
      <span class="mic">◉</span>
      <span class="hold">HOLD TO TALK</span>
    </button>

    <div class="status" id="status">
      <span class="dot"></span>
      AUDIO-LINK READY
    </div>

  </main>

  <section class="conversation-panel">
    <div class="conversation-title">
      CONVERSATION // LAST 5 EXCHANGES
    </div>

    <div id="conversationHistory">
      <div class="history-empty">
        NO CONVERSATION YET
      </div>
    </div>
  </section>

  <form
    class="text-chat"
    id="textChat"
    autocomplete="off"
  >
    <input
      id="textInput"
      type="text"
      maxlength="300"
      placeholder="Write to Volp-E..."
      enterkeyhint="send"
    >

    <button
      id="textSend"
      type="submit"
    >
      SEND
    </button>
  </form>

  <section class="telemetry">

    <div class="box">
      <div class="name">INPUT</div>
      <div class="value" id="device">DEFAULT</div>
    </div>

    <div class="box">
      <div class="name">DURATION</div>
      <div class="value" id="duration">0.0s</div>
    </div>

    <div class="box">
      <div class="name">CAPTURE</div>
      <div class="value" id="size">0 KB</div>
    </div>

  </section>

</div>


<script>
const button =
  document.getElementById("talkButton");

const wave =
  document.getElementById("wave");

const statusBox =
  document.getElementById("status");

let recording=false;
let startedAt=0;
let timer=null;

const textChat =
  document.getElementById("textChat");

const textInput =
  document.getElementById("textInput");

const textSend =
  document.getElementById("textSend");

let textBusy=false;

const historyBox =
  document.getElementById("conversationHistory");

const HISTORY_KEY =
  "volpe_conversation_history_v1";

const HISTORY_LIMIT = 5;

let conversationHistory=[];


function loadConversationHistory(){
  try{
    const stored=
      JSON.parse(
        localStorage.getItem(HISTORY_KEY) || "[]"
      );

    if(Array.isArray(stored)){
      conversationHistory=
        stored.slice(-HISTORY_LIMIT);
    }
  }catch(error){
    conversationHistory=[];
  }

  renderConversationHistory();
}


function saveConversationHistory(){
  try{
    localStorage.setItem(
      HISTORY_KEY,
      JSON.stringify(conversationHistory)
    );
  }catch(error){}
}


function escapeHtml(value){
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function renderConversationHistory(){
  if(!historyBox){
    return;
  }

  if(!conversationHistory.length){
    historyBox.innerHTML=
      '<div class="history-empty">'+
      'NO CONVERSATION YET'+
      '</div>';
    return;
  }

  historyBox.innerHTML=
    conversationHistory.map(exchange=>{
      return (
        '<div class="exchange">'+

          '<div class="message-label user">'+
            'YOU'+
          '</div>'+

          '<div class="message-text">'+
            escapeHtml(exchange.user)+
          '</div>'+

          '<div class="message-label volpe">'+
            'VOLP-E'+
          '</div>'+

          '<div class="message-text volpe">'+
            escapeHtml(exchange.reply)+
          '</div>'+

        '</div>'
      );
    }).join("");

  const panel=
    historyBox.closest(
      ".conversation-panel"
    );

  if(panel){
    panel.scrollTop=
      panel.scrollHeight;
  }
}


function addExchange(user,reply){
  user=String(user || "").trim();
  reply=String(reply || "").trim();

  if(!user && !reply){
    return;
  }

  conversationHistory.push({
    user:user || "[EMPTY]",
    reply:reply || "[NO RESPONSE]"
  });

  conversationHistory=
    conversationHistory.slice(
      -HISTORY_LIMIT
    );

  saveConversationHistory();
  renderConversationHistory();
}



function setStatus(text,type=""){
  statusBox.className=
    "status" + (type ? " "+type : "");

  statusBox.innerHTML=
    '<span class="dot"></span>'+text;
}


function updateLocalTimer(){
  if(!recording) return;

  const seconds=
    (Date.now()-startedAt)/1000;

  document.getElementById("duration").textContent=
    seconds.toFixed(1)+"s";
}


async function startTalk(event){
  if(event){
    event.preventDefault();
  }

  if(recording) return;

  setStatus("OPENING AUDIO CHANNEL...");

  try{
    const response=
      await fetch(
        "/api/talk/start?t="+Date.now()
      );

    const data=
      await response.json();

    if(!response.ok || !data.ok){
      throw new Error(
        data.error || "Capture start failed"
      );
    }

    recording=true;
    startedAt=Date.now();

    button.classList.add("active");
    wave.classList.add("listening");

    setStatus("LISTENING // RELEASE TO SEND","listen");

    document.getElementById("device").textContent=
      String(
        data.talk.device || "default"
      ).toUpperCase();

    timer=setInterval(
      updateLocalTimer,
      100
    );

  }catch(error){
    console.error(error);

    setStatus(
      "AUDIO INPUT ERROR",
      "error"
    );
  }
}


async function stopTalk(event){
  if(event){
    event.preventDefault();
  }

  if(!recording) return;

  recording=false;

  clearInterval(timer);
  timer=null;

  button.classList.remove("active");
  wave.classList.remove("listening");

  setStatus("FINALIZING CAPTURE...");

  try{
    const response=
      await fetch(
        "/api/talk/stop?t="+Date.now()
      );

    const data=
      await response.json();

    if(!response.ok || !data.ok){
      throw new Error(
        data.error || "Capture stop failed"
      );
    }

    const talk=data.talk;

    document.getElementById("duration").textContent=
      Number(
        talk.duration_seconds || 0
      ).toFixed(1)+"s";

    document.getElementById("size").textContent=
      Math.max(
        0,
        Number(talk.audio_bytes || 0)/1024
      ).toFixed(1)+" KB";

    setStatus(
      "PROCESSING SPEECH..."
    );

    const processResponse =
      await fetch(
        "/api/talk/process?t="+Date.now()
      );

    const processData =
      await processResponse.json();

    if(
      !processResponse.ok ||
      !processData.ok
    ){
      throw new Error(
        processData.error ||
        "Speech processing failed"
      );
    }

    const transcript =
      String(
        processData.talk.transcript || ""
      ).trim();

    const pendingUserMessage =
      transcript || "[NO SPEECH DETECTED]";

    setStatus(
      "THINKING..."
    );

    const thinkResponse =
      await fetch(
        "/api/talk/think?t="+Date.now()
      );

    const thinkData =
      await thinkResponse.json();

    if(
      !thinkResponse.ok ||
      !thinkData.ok
    ){
      throw new Error(
        thinkData.error ||
        "Thinking failed"
      );
    }

    const reply =
      String(
        thinkData.talk.reply || ""
      ).trim();

    addExchange(
      pendingUserMessage,
      reply || "[NO RESPONSE]"
    );

    setStatus(
      "RESPONDING...",
      "listen"
    );

    wave.classList.add("listening");

    const speakResponse =
      await fetch(
        "/api/say?force=1&sync=1&text="+
        encodeURIComponent(reply)
      );

    const speakData =
      await speakResponse.json();

    wave.classList.remove("listening");

    if(
      !speakResponse.ok ||
      !speakData.ok
    ){
      throw new Error(
        speakData.error ||
        "Speech output failed"
      );
    }

    setStatus(
      "AUDIO-LINK READY",
      "listen"
    );

  }catch(error){
    console.error(error);

    setStatus(
      "CAPTURE FAILED",
      "error"
    );
  }
}


async function sendTextMessage(event){
  event.preventDefault();

  if(textBusy || recording){
    return;
  }

  const message =
    String(textInput.value || "").trim();

  if(!message){
    return;
  }

  textBusy=true;
  textInput.disabled=true;
  textSend.disabled=true;

  setStatus("THINKING...");

  try{
    const response=
      await fetch(
        "/api/chat/text?text="+
        encodeURIComponent(message)+
        "&t="+Date.now()
      );

    const data=
      await response.json();

    if(!response.ok || !data.ok){
      throw new Error(
        data.error || "Chat failed"
      );
    }

    const reply=
      String(
        data.talk.reply || ""
      ).trim();

    addExchange(
      message,
      reply || "[NO RESPONSE]"
    );

    setStatus(
      "RESPONDING...",
      "listen"
    );

    wave.classList.add("listening");

    const speakResponse=
      await fetch(
        "/api/say?force=1&sync=1&text="+
        encodeURIComponent(reply)
      );

    const speakData=
      await speakResponse.json();

    wave.classList.remove("listening");

    if(
      !speakResponse.ok ||
      !speakData.ok
    ){
      throw new Error(
        speakData.error ||
        "Speech output failed"
      );
    }

    textInput.value="";

    setStatus(
      "AUDIO-LINK READY",
      "listen"
    );

  }catch(error){
    console.error(error);

    wave.classList.remove("listening");

    setStatus(
      "TEXT CHAT ERROR",
      "error"
    );

  }finally{
    textBusy=false;
    textInput.disabled=false;
    textSend.disabled=false;
    textInput.focus();
  }
}


textChat.addEventListener(
  "submit",
  sendTextMessage
);


button.addEventListener(
  "pointerdown",
  startTalk
);

button.addEventListener(
  "pointerup",
  stopTalk
);

button.addEventListener(
  "pointercancel",
  stopTalk
);

button.addEventListener(
  "pointerleave",
  event=>{
    if(recording){
      stopTalk(event);
    }
  }
);


async function loadStatus(){
  try{
    const response=
      await fetch(
        "/api/talk/status?t="+Date.now()
      );

    const data=
      await response.json();

    if(!data.ok) return;

    const talk=data.talk;

    document.getElementById("device").textContent=
      String(
        talk.device || "default"
      ).toUpperCase();

    document.getElementById("duration").textContent=
      Number(
        talk.duration_seconds || 0
      ).toFixed(1)+"s";

    document.getElementById("size").textContent=
      (
        Number(talk.audio_bytes || 0)/1024
      ).toFixed(1)+" KB";

  }catch(error){}
}

loadStatus();
loadConversationHistory();
</script>

</body>
</html>
