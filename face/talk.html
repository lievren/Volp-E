<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no">

<meta name="theme-color" content="#05070d">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Volp-E // Talk</title>

<style>
:root{
  --bg:#05070d;
  --panel:rgba(9,17,31,.9);
  --cyan:#31f5ff;
  --pink:#ff3bd4;
  --green:#4dff9b;
  --orange:#ffb347;
  --red:#ff5f77;
  --text:#ecfaff;
  --muted:#7892a8;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  color:var(--text);
  font-family:Arial,sans-serif;
  background:
    radial-gradient(circle at 10% 0%,
      rgba(255,59,212,.15),transparent 30%),
    radial-gradient(circle at 100% 20%,
      rgba(49,245,255,.13),transparent 30%),
    #05070d;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(
      rgba(49,245,255,.035) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(49,245,255,.035) 1px,
      transparent 1px
    );
  background-size:27px 27px;
}

.app{
  width:min(94vw,620px);
  height:100dvh;
  margin:auto;
  padding:10px 0;
  display:grid;
  grid-template-rows:auto 1fr auto auto;
  gap:8px;
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.back{
  padding:8px 11px;
  color:var(--cyan);
  text-decoration:none;
  border-radius:11px;
  border:1px solid rgba(49,245,255,.25);
  background:rgba(49,245,255,.05);
  font-size:12px;
}

.heading{
  text-align:right;
}

.heading strong{
  display:block;
  color:var(--pink);
  font-size:13px;
  letter-spacing:2px;
}

.heading small{
  color:var(--muted);
  font:9px Consolas,monospace;
}

.main{
  position:relative;
  min-height:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  border:1px solid rgba(255,59,212,.20);
  border-radius:18px;
  background:var(--panel);
  overflow:hidden;
}

.main:before{
  content:"VOICE INPUT CHANNEL";
  position:absolute;
  top:12px;
  left:14px;
  color:var(--cyan);
  font:9px Consolas,monospace;
  letter-spacing:1.5px;
}

.wave{
  height:65px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  margin-bottom:18px;
}

.bar{
  width:4px;
  height:10px;
  border-radius:5px;
  background:var(--cyan);
  box-shadow:0 0 8px var(--cyan);
}

.listening .bar{
  animation:wave .45s ease-in-out infinite alternate;
}

.bar:nth-child(2){animation-delay:.06s}
.bar:nth-child(3){animation-delay:.12s}
.bar:nth-child(4){animation-delay:.18s}
.bar:nth-child(5){animation-delay:.24s}
.bar:nth-child(6){animation-delay:.16s}
.bar:nth-child(7){animation-delay:.08s}
.bar:nth-child(8){animation-delay:.20s}
.bar:nth-child(9){animation-delay:.10s}

@keyframes wave{
  from{height:8px}
  to{height:52px}
}

.talk-button{
  position:relative;
  width:min(47vw,190px);
  aspect-ratio:1;
  border-radius:50%;
  border:2px solid var(--pink);
  background:
    radial-gradient(
      circle,
      rgba(255,59,212,.22),
      rgba(255,59,212,.05) 55%,
      rgba(0,0,0,.15)
    );
  color:var(--pink);
  box-shadow:
    0 0 25px rgba(255,59,212,.18),
    inset 0 0 25px rgba(255,59,212,.10);
  touch-action:none;
  user-select:none;
  cursor:pointer;
}

.talk-button:before{
  content:"";
  position:absolute;
  inset:10px;
  border-radius:50%;
  border:1px solid rgba(49,245,255,.23);
}

.mic{
  display:block;
  font-size:37px;
  margin-bottom:7px;
}

.hold{
  display:block;
  font:bold 11px Consolas,monospace;
  letter-spacing:1.5px;
}

.talk-button.active{
  color:var(--green);
  border-color:var(--green);
  box-shadow:
    0 0 35px rgba(77,255,155,.32),
    inset 0 0 30px rgba(77,255,155,.13);
  transform:scale(.97);
}

.status{
  margin-top:20px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 12px;
  border-radius:999px;
  border:1px solid rgba(49,245,255,.16);
  color:var(--cyan);
  background:rgba(49,245,255,.04);
  font:bold 10px Consolas,monospace;
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:currentColor;
  box-shadow:0 0 8px currentColor;
}

.status.listen{
  color:var(--green);
  border-color:rgba(77,255,155,.25);
}

.status.error{
  color:var(--red);
  border-color:rgba(255,95,119,.25);
}

.telemetry{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:6px;
}

.box{
  min-width:0;
  padding:9px 6px;
  border:1px solid rgba(49,245,255,.13);
  border-radius:11px;
  background:rgba(9,17,31,.9);
  text-align:center;
}

.box .name{
  color:var(--muted);
  font:8px Consolas,monospace;
  letter-spacing:.8px;
}

.box .value{
  margin-top:4px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  color:var(--cyan);
  font:bold 10px Consolas,monospace;
}

@media(max-height:700px){
  .app{
    padding:6px 0;
    gap:5px;
  }

  .talk-button{
    width:min(38vw,145px);
  }

  .wave{
    height:42px;
    margin-bottom:8px;
  }

  .status{
    margin-top:10px;
  }

  .box{
    padding:6px 4px;
  }
}
</style>
</head>

<body>

<div class="app">

  <header class="top">
    <a class="back" href="/">‹ CORE</a>

    <div class="heading">
      <strong>TALK CONTROL</strong>
      <small>VOLP-E // AUDIO-LINK</small>
    </div>
  </header>

  <main class="main" id="mainPanel">

    <div class="wave" id="wave">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </div>

    <button
      class="talk-button"
      id="talkButton"
      type="button"
    >
      <span class="mic">◉</span>
      <span class="hold">HOLD TO TALK</span>
    </button>

    <div class="status" id="status">
      <span class="dot"></span>
      AUDIO-LINK READY
    </div>

  </main>

  <section
    id="transcriptPanel"
    style="
      border:1px solid rgba(49,245,255,.18);
      border-radius:11px;
      background:rgba(9,17,31,.9);
      padding:8px 10px;
      min-height:46px;
      overflow:hidden;
    "
  >
    <div style="
      color:#ff3bd4;
      font:8px Consolas,monospace;
      letter-spacing:1.2px;
      margin-bottom:4px;
    ">
      TRANSCRIPTION // STT
    </div>

    <div
      id="transcript"
      style="
        color:#ecfaff;
        font:11px Consolas,monospace;
        white-space:nowrap;
        overflow:hidden;
        text-overflow:ellipsis;
      "
    >
      Waiting for voice input...
    </div>

    <div style="
      color:#31f5ff;
      font:8px Consolas,monospace;
      letter-spacing:1.2px;
      margin-top:7px;
      margin-bottom:3px;
    ">
      VOLP-E // RESPONSE
    </div>

    <div
      id="reply"
      style="
        color:#4dff9b;
        font:10px Consolas,monospace;
        white-space:nowrap;
        overflow:hidden;
        text-overflow:ellipsis;
      "
    >
      Waiting...
    </div>
  </section>

  <section class="telemetry">

    <div class="box">
      <div class="name">INPUT</div>
      <div class="value" id="device">DEFAULT</div>
    </div>

    <div class="box">
      <div class="name">DURATION</div>
      <div class="value" id="duration">0.0s</div>
    </div>

    <div class="box">
      <div class="name">CAPTURE</div>
      <div class="value" id="size">0 KB</div>
    </div>

  </section>

</div>


<script>
const button =
  document.getElementById("talkButton");

const wave =
  document.getElementById("wave");

const statusBox =
  document.getElementById("status");

let recording=false;
let startedAt=0;
let timer=null;


function setStatus(text,type=""){
  statusBox.className=
    "status" + (type ? " "+type : "");

  statusBox.innerHTML=
    '<span class="dot"></span>'+text;
}


function updateLocalTimer(){
  if(!recording) return;

  const seconds=
    (Date.now()-startedAt)/1000;

  document.getElementById("duration").textContent=
    seconds.toFixed(1)+"s";
}


async function startTalk(event){
  if(event){
    event.preventDefault();
  }

  if(recording) return;

  setStatus("OPENING AUDIO CHANNEL...");

  try{
    const response=
      await fetch(
        "/api/talk/start?t="+Date.now()
      );

    const data=
      await response.json();

    if(!response.ok || !data.ok){
      throw new Error(
        data.error || "Capture start failed"
      );
    }

    recording=true;
    startedAt=Date.now();

    button.classList.add("active");
    wave.classList.add("listening");

    setStatus("LISTENING // RELEASE TO SEND","listen");

    document.getElementById("device").textContent=
      String(
        data.talk.device || "default"
      ).toUpperCase();

    timer=setInterval(
      updateLocalTimer,
      100
    );

  }catch(error){
    console.error(error);

    setStatus(
      "AUDIO INPUT ERROR",
      "error"
    );
  }
}


async function stopTalk(event){
  if(event){
    event.preventDefault();
  }

  if(!recording) return;

  recording=false;

  clearInterval(timer);
  timer=null;

  button.classList.remove("active");
  wave.classList.remove("listening");

  setStatus("FINALIZING CAPTURE...");

  try{
    const response=
      await fetch(
        "/api/talk/stop?t="+Date.now()
      );

    const data=
      await response.json();

    if(!response.ok || !data.ok){
      throw new Error(
        data.error || "Capture stop failed"
      );
    }

    const talk=data.talk;

    document.getElementById("duration").textContent=
      Number(
        talk.duration_seconds || 0
      ).toFixed(1)+"s";

    document.getElementById("size").textContent=
      Math.max(
        0,
        Number(talk.audio_bytes || 0)/1024
      ).toFixed(1)+" KB";

    setStatus(
      "PROCESSING SPEECH..."
    );

    const processResponse =
      await fetch(
        "/api/talk/process?t="+Date.now()
      );

    const processData =
      await processResponse.json();

    if(
      !processResponse.ok ||
      !processData.ok
    ){
      throw new Error(
        processData.error ||
        "Speech processing failed"
      );
    }

    const transcript =
      String(
        processData.talk.transcript || ""
      ).trim();

    document.getElementById(
      "transcript"
    ).textContent =
      transcript || "[NO SPEECH DETECTED]";

    setStatus(
      "THINKING..."
    );

    const thinkResponse =
      await fetch(
        "/api/talk/think?t="+Date.now()
      );

    const thinkData =
      await thinkResponse.json();

    if(
      !thinkResponse.ok ||
      !thinkData.ok
    ){
      throw new Error(
        thinkData.error ||
        "Thinking failed"
      );
    }

    const reply =
      String(
        thinkData.talk.reply || ""
      ).trim();

    document.getElementById(
      "reply"
    ).textContent =
      reply || "[NO RESPONSE]";

    setStatus(
      "RESPONDING...",
      "listen"
    );

    wave.classList.add("listening");

    const speakResponse =
      await fetch(
        "/api/say?force=1&sync=1&text="+
        encodeURIComponent(reply)
      );

    const speakData =
      await speakResponse.json();

    wave.classList.remove("listening");

    if(
      !speakResponse.ok ||
      !speakData.ok
    ){
      throw new Error(
        speakData.error ||
        "Speech output failed"
      );
    }

    setStatus(
      "AUDIO-LINK READY",
      "listen"
    );

  }catch(error){
    console.error(error);

    setStatus(
      "CAPTURE FAILED",
      "error"
    );
  }
}


button.addEventListener(
  "pointerdown",
  startTalk
);

button.addEventListener(
  "pointerup",
  stopTalk
);

button.addEventListener(
  "pointercancel",
  stopTalk
);

button.addEventListener(
  "pointerleave",
  event=>{
    if(recording){
      stopTalk(event);
    }
  }
);


async function loadStatus(){
  try{
    const response=
      await fetch(
        "/api/talk/status?t="+Date.now()
      );

    const data=
      await response.json();

    if(!data.ok) return;

    const talk=data.talk;

    document.getElementById("device").textContent=
      String(
        talk.device || "default"
      ).toUpperCase();

    document.getElementById("duration").textContent=
      Number(
        talk.duration_seconds || 0
      ).toFixed(1)+"s";

    document.getElementById("size").textContent=
      (
        Number(talk.audio_bytes || 0)/1024
      ).toFixed(1)+" KB";

  }catch(error){}
}

loadStatus();
</script>

</body>
</html>
